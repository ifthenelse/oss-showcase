name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-showcase-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    if: github.repository == 'ifthenelse/oss-showcase' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the verified version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh
